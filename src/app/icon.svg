<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="8" fill="#070b19" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#streamGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Lightning stream bolt -->
  <path d="M18 4L8 16h6l-2 12 12-14h-7l3-10z" fill="url(#streamGrad)" filter="url(#glow)" />
</svg>
